spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://localhost:5436/aidb
    username: hotel
    password: hotel
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
  # Configuración de Jackson para serializar fechas correctamente
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

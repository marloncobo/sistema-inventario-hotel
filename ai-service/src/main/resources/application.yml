spring:
  application:
    name: ai-service

server:
  port: ${PORT:8085}

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}

gemini:
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${JWT_SECRET:hotel-inventory-demo-secret-key-32}
